{% extends 'base.html' %}

{% block title %}{{ profile_user.username }} - Profil Gizli{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 text-center">
            <div class="ax-card p-5">
                <div class="ax-profile-avatar-placeholder mx-auto mb-4" style="width:72px;height:72px;font-size:2rem;">
                    {{ profile_user.username|slice:":1"|upper }}
                </div>
                <h4 class="text-white fw-bold mb-1">{{ profile_user.username }}</h4>
                <p class="text-muted mb-4">Bu kullanıcı profilini gizli tutmayı tercih etmiştir.</p>
                <div class="d-flex align-items-center justify-content-center gap-2 text-muted small mb-4">
                    <i class="bi bi-lock-fill"></i>
                    <span>Profil gizli</span>
                </div>
                <a href="{% url 'forum_index' %}" class="ax-btn ax-btn--primary">Foruma Dön</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
