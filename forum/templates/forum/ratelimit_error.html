{% extends 'base.html' %}

{% block title %}Çok Fazla İstek - Analizus{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card border-0 shadow-lg" style="background: rgba(15, 23, 42, 0.9); border-radius: 20px;">
                <div class="card-body p-5">
                    <div class="mb-4">
                        <i class="bi bi-shield-exclamation text-warning" style="font-size: 5rem;"></i>
                    </div>
                    <h2 class="text-white fw-bold mb-3">Yavaş Ol!</h2>
                    <p class="text-muted mb-4">
                        Çok fazla istek gönderdiniz. Lütfen birkaç dakika bekleyip tekrar deneyin.
                    </p>
                    <div class="alert alert-warning bg-transparent border-warning text-warning">
                        <i class="bi bi-info-circle me-2"></i>
                        Bu koruma, spam ve kötü niyetli saldırıları engellemek için aktiftir.
                    </div>
                    <a href="{% url 'home' %}" class="btn btn-primary rounded-pill px-4 mt-3">
                        <i class="bi bi-house me-2"></i>Ana Sayfaya Dön
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
