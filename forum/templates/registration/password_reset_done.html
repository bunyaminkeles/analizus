{% extends 'base.html' %}

{% block title %}E-posta Gönderildi - Analizus{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="login-container">
        <div class="card shadow-lg border-0" style="background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px);">
            <div class="card-body p-4 text-center">
                <i class="bi bi-envelope-check display-1 text-success mb-3"></i>
                <h3 class="text-white mb-3">E-posta Gönderildi</h3>
                <p class="text-white">
                    Şifre sıfırlama talimatlarını içeren bir e-posta gönderdik. 
                    Lütfen gelen kutunuzu (ve spam klasörünü) kontrol edin.
                </p>
                <a href="{% url 'login' %}" class="btn btn-outline-light mt-3">Giriş Sayfasına Dön</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
