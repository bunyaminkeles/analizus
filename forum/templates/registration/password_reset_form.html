{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Şifremi Unuttum - Analizus{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="login-container">
        <div class="card shadow-lg border-0" style="background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px);">
            <div class="card-body p-4">
                <h3 class="text-center text-white mb-4">Şifre Sıfırlama</h3>
                <p class="text-muted text-center mb-4">E-posta adresinizi girin, size şifre sıfırlama bağlantısı gönderelim.</p>
                
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid mt-3">
                        <button type="submit" class="btn btn-primary">Sıfırlama Linki Gönder</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
