name: Deploy to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 89.167.5.224
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /app
            git pull origin main
            docker compose restart web
