version: '3.8'

services:
  redis:
    image: redis:7-alpine
    restart: always

  web:
    build: .
    restart: always
    env_file: .env
    expose:
      - "8000"
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    restart: always
    network_mode: "host"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web
