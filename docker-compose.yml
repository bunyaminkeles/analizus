services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bunyamin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analizus}
      POSTGRES_DB: ${POSTGRES_DB:-analizus}
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always

  web:
    build: .
    restart: always
    env_file: .env
    expose:
      - "8000"
    depends_on:
      - redis
      - db

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web

volumes:
  db_data:
