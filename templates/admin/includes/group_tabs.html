{% if group_tabs %}
<div class="flex flex-wrap gap-1 mb-4 border-b border-base-200 dark:border-base-800">
    {% for tab in group_tabs %}
    <a href="{{ tab.url }}"
       class="px-3 py-2 text-sm font-medium rounded-t-default -mb-px border-b-2 {% if tab.active %}border-primary-600 text-primary-600 dark:text-primary-500{% else %}border-transparent text-base-500 hover:text-base-700 dark:text-base-400 dark:hover:text-base-200{% endif %}">
        {{ tab.title }}
    </a>
    {% endfor %}
</div>
{% endif %}
