{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Değiştirildi - Analizus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

        .split-container {
            display: flex;
            height: 100vh;
        }

        .left-half {
            flex: 0 0 50%;
            height: 100%;
            background-color: #0a1628;
            background-image: url("{% static 'forum/images/login-hero.jpeg' %}");
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        .left-half::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 20%, rgba(10, 22, 40, 0.4) 50%, #0a1628 85%);
            pointer-events: none;
            z-index: 1;
        }

        .left-half::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: linear-gradient(180deg, transparent, #10b981, transparent);
            animation: fall 5s linear infinite;
            z-index: 2;
        }

        @keyframes fall {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .right-half {
            flex: 0 0 50%;
            height: 100%;
            background: #0a1628;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .top-bar {
            position: absolute;
            top: 1.5rem;
            right: 2rem;
        }

        .back-link {
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .back-link:hover { color: #fff; }

        .form-area {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .success-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.1));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            position: relative;
        }

        .success-icon::after {
            content: '';
            position: absolute;
            inset: -8px;
            border: 2px solid rgba(16, 185, 129, 0.3);
            border-radius: 50%;
            animation: ring 2s ease-out infinite;
        }

        @keyframes ring {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .success-icon i {
            font-size: 3rem;
            color: #10b981;
        }

        .form-title {
            font-size: 1.75rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 1rem;
        }

        .form-subtitle {
            color: #888;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .action-btn {
            display: inline-block;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            border-radius: 8px;
            padding: 1rem 2.5rem;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .action-btn:hover {
            box-shadow: 0 5px 25px rgba(16, 185, 129, 0.4);
            transform: translateY(-2px);
            color: #fff;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ff6b4a;
            animation: confetti-fall 3s ease-out forwards;
            opacity: 0;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        @media (max-width: 991px) {
            .split-container { flex-direction: column; }
            .left-half { display: none; }
            .right-half { flex-basis: 100%; }
        }
    </style>
</head>
<body>
    <div class="split-container">
        <div class="left-half"></div>

        <div class="right-half">
            <div class="top-bar">
                <a href="{% url 'home' %}" class="back-link">
                    <i class="bi bi-arrow-left"></i> Ana Sayfa
                </a>
            </div>

            <div class="form-area">
                <div class="success-icon">
                    <i class="bi bi-check-lg"></i>
                </div>
                <h1 class="form-title">Tebrikler!</h1>
                <p class="form-subtitle">
                    Şifreniz başarıyla güncellendi.<br>
                    Artık yeni şifrenizle giriş yapabilirsiniz.
                </p>

                <a href="{% url 'login' %}" class="action-btn">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Giriş Yap
                </a>
            </div>
        </div>
    </div>

    <script>
        // Konfeti efekti
        function createConfetti() {
            const colors = ['#ff6b4a', '#10b981', '#3b82f6', '#f59e0b', '#8b5cf6'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    confetti.style.width = (Math.random() * 10 + 5) + 'px';
                    confetti.style.height = confetti.style.width;
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 50);
            }
        }
        createConfetti();
    </script>
</body>
</html>
