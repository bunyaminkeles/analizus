{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>E-posta Gönderildi - Analizus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

        .split-container {
            display: flex;
            height: 100vh;
        }

        .left-half {
            flex: 0 0 50%;
            height: 100%;
            background-color: #0a1628;
            background-image: url("{% static 'forum/images/login-hero.jpeg' %}");
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        .left-half::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 20%, rgba(10, 22, 40, 0.4) 50%, #0a1628 85%);
            pointer-events: none;
            z-index: 1;
        }

        .left-half::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: linear-gradient(180deg, transparent, #10b981, transparent);
            animation: fall 5s linear infinite;
            z-index: 2;
        }

        @keyframes fall {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }

        .right-half {
            flex: 0 0 50%;
            height: 100%;
            background: #0a1628;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .top-bar {
            position: absolute;
            top: 1.5rem;
            right: 2rem;
        }

        .back-link {
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .back-link:hover { color: #fff; }

        .form-area {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.1));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .success-icon i {
            font-size: 2.5rem;
            color: #10b981;
        }

        .form-title {
            font-size: 1.75rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 1rem;
        }

        .form-subtitle {
            color: #888;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .info-box {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 2rem;
        }

        .info-box p {
            color: #10b981;
            font-size: 0.9rem;
            margin: 0;
        }

        .info-box i {
            margin-right: 0.5rem;
        }

        .action-btn {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b4a, #e55a3a);
            border: none;
            border-radius: 8px;
            padding: 0.9rem 2rem;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .action-btn:hover {
            box-shadow: 0 5px 20px rgba(255,107,74,0.4);
            color: #fff;
        }

        .footer-text {
            margin-top: 2rem;
            color: #555;
            font-size: 0.85rem;
        }

        @media (max-width: 991px) {
            .split-container { flex-direction: column; }
            .left-half { display: none; }
            .right-half { flex-basis: 100%; }
        }
    </style>
</head>
<body>
    <div class="split-container">
        <div class="left-half"></div>

        <div class="right-half">
            <div class="top-bar">
                <a href="{% url 'home' %}" class="back-link">
                    <i class="bi bi-arrow-left"></i> Ana Sayfa
                </a>
            </div>

            <div class="form-area">
                <div class="success-icon">
                    <i class="bi bi-envelope-check"></i>
                </div>
                <h1 class="form-title">E-posta Gönderildi!</h1>
                <p class="form-subtitle">
                    Şifre sıfırlama talimatlarını içeren bir e-posta gönderdik.
                </p>

                <div class="info-box">
                    <p><i class="bi bi-info-circle"></i>E-postayı göremiyorsanız spam/gereksiz klasörünü kontrol edin.</p>
                </div>

                <a href="{% url 'login' %}" class="action-btn">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Giriş Sayfasına Dön
                </a>

                <p class="footer-text">
                    E-posta gelmedi mi? Birkaç dakika bekleyin veya <a href="{% url 'password_reset' %}" style="color: #ff6b4a;">tekrar deneyin</a>.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
