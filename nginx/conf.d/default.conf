server {
    listen 80;
    server_name analizus.com www.analizus.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.analizus.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name analizus.com;

    ssl_certificate /etc/letsencrypt/live/analizus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analizus.com/privkey.pem;

    return 301 https://www.analizus.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.analizus.com;

    ssl_certificate /etc/letsencrypt/live/analizus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analizus.com/privkey.pem;

    resolver 127.0.0.11 valid=10s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/xhtml+xml
        font/ttf
        font/otf
        image/svg+xml;

    location /ws/ {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        set $backend http://web:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        client_max_body_size 20M;
    }
}
