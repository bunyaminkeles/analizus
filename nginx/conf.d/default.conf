server {
    listen 80;
    server_name analizus.com www.analizus.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name analizus.com;

    ssl_certificate /etc/letsencrypt/live/analizus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analizus.com/privkey.pem;

    return 301 https://www.analizus.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.analizus.com;

    ssl_certificate /etc/letsencrypt/live/analizus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analizus.com/privkey.pem;

    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 1d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        client_max_body_size 20M;
    }
}
